<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#070A12" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle glow dot -->
  <circle cx="50" cy="14" r="3" fill="#10B981" filter="url(#glow)" />
  <circle cx="50" cy="14" r="2" fill="#34D399" />

  <!-- Monogram TA -->
  <text
    x="31"
    y="43"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="30"
    font-weight="900"
    letter-spacing="-1.5"
    text-anchor="middle"
    fill="url(#textGrad)"
  >TA</text>
</svg>
